include:
- file: /common.yml
  project: QubesOS/qubes-continuous-integration
- file: /r4.3/gitlab-base.yml
  project: QubesOS/qubes-continuous-integration
- file: /r4.3/gitlab-host.yml
  project: QubesOS/qubes-continuous-integration

lint:
  extends: .lint
  stage: checks
  variables:
    DIR: vmupdate

mypy:
  stage: checks
  tags:
    - docker
  before_script:
    - sudo dnf install -y python3-mypy python3-pip
    - sudo python3 -m pip install lxml-stubs types-docutils
  script:
    - mypy --install-types --non-interactive --ignore-missing-imports --junit-xml mypy.xml vmupdate
  artifacts:
    reports:
      junit: mypy.xml

checks:tests:
  stage: checks
  variables:
    PYTEST_ADDOPTS: "--color=yes"
  before_script: &before-script
    - "PATH=$PATH:$HOME/.local/bin"
    - sudo dnf install -y python3-pytest python3-coverage python3-pip
    - pip3 install --quiet -r ci/requirements.txt
    - git clone https://github.com/QubesOS/qubes-core-admin-client ~/core-admin-client
  script:
    - export PATH="$HOME/.local/bin:$PATH"
    - PYTHONPATH=~/core-admin-client ./run-tests.sh
  after_script:
    - "PATH=$PATH:$HOME/.local/bin"
    - ci/codecov-wrapper
